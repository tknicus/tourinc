<!DOCTYPE html>
<html lang="en">
<head>

    <!-- 🗺️ LEAFLET CSS (Map Design) 🗺️ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e1e1e;
            padding: 10px 15px;
            text-align: center;
            border-bottom: 4px solid #0088ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 1px;
            font-size: 15px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            background-color: #222;
        }

        select {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #0088ff;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-btn {
            background-color: #0088ff;
            color: white;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }

        .action-btn:hover {
            background-color: #0066cc;
        }

        .back-btn {
            background-color: #cc0000;
        }

        .back-btn:hover {
            background-color: #990000;
        }

        .distance-badge {
            background: #222;
            color: #00ff00;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #444;
            font-size: 12px;
        }

        .rider-count-badge {
            background: #ffaa00;
            color: #121212;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #cc8800;
            font-size: 12px;
            display: inline-block;
        }

        /* 🌫️ POPUP BOX TRANSPARENCY & GLASS EFFECT */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 🚨 SOS BLINKING & PULSING MARKER ANIMATION */
        @keyframes sosPulsing {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.9);
            }
            70% {
                transform: scale(1.3);
                box-shadow: 0 0 0 18px rgba(255, 0, 0, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }

            background-color: #ff0000;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            animation: sosPulsing 1s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            font-weight: bold;

        async function checkAccessCode() {
            let inputCode = document.getElementById('accessCodeInput').value.trim();
            let errorMsg = document.getElementById('passcodeError');
            let selectElem = document.getElementById('routeSelect');

            if (!inputCode) {
                errorMsg.innerText = "❌ Palihug og enter sa passcode!";
                errorMsg.style.display = 'block';
                return;
            }

            if (typeof riderDatabase === 'undefined') {
                errorMsg.innerText = "⚠️ Error: Dili ma-read ang riderDatabase!";
                errorMsg.style.display = 'block';
                return;
            }

            // SHA-256 Hashing
            const encoder = new TextEncoder();
            const data = encoder.encode(inputCode);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // Pangitaon ang user sa riderDatabase
            let foundUser = riderDatabase.find(r => r.passcode === hashedInput);

            if (foundUser) {
                document.getElementById('passcodeModal').style.display = 'none';
                errorMsg.style.display = 'none';

                let isAdminUser = (foundUser.isAdmin === true || String(foundUser.isAdmin).toLowerCase() === 'true');
                let isMarshalUser = (foundUser.isMarshal === true || String(foundUser.isMarshal).toLowerCase() === 'true');
                let userLevel = (foundUser.level || "").toUpperCase();

                // Store in Global State
                currentUserRole.isAdmin = isAdminUser;
                currentUserRole.isMarshal = isMarshalUser;
                currentUserRole.userLevel = userLevel;

                        option.style.display = ""; 
                    }
                    selectElem.value = "all";
                    switchRoute();
                }

                            option.style.display = "";
                        } else {
                            option.style.display = "none";
                        }
                    }
                    selectElem.value = "all";
                    switchRoute();
                }

        // ==========================================
        // 🗺️ HYBRID ROUTE SWITCHING LOGIC
        // ==========================================
        async function switchRoute() {
            let rawKey = document.getElementById('routeSelect').value;
            let selectedKey = rawKey ? rawKey.trim().toUpperCase() : "";
            let badge = document.getElementById('distanceBadge');
            
            routePolylineLayer.clearLayers();

            if (!routesData[selectedKey] || routesData[selectedKey].length < 2) {
                badge.style.display = "none";
                loadRidersToMap(selectedKey); 
                return;
            }

            let coords = routesData[selectedKey];
            let pinColor = (selectedKey === "AS26") ? "#ff0000" : (routeColors[selectedKey] || '#ff0000');

            if (selectedKey === "AS26") {
                let highwayPart1 = coords.slice(0, 11);
                let trailPart = coords.slice(12, 123);
                let highwayPart2 = coords.slice(122);

                await fetchAndDrawOSRM(highwayPart1, pinColor);

                let directTrail = L.polyline(trailPart, {
                    color: pinColor,
                    weight: 2,
                    opacity: 0.9,
                    dashArray: '6, 6' 
                });
                routePolylineLayer.addLayer(directTrail);

                await fetchAndDrawOSRM(highwayPart2, pinColor);

                badge.innerText = `🏁 Route AS26 (Hybrid: Road & Trail)`;
                badge.style.display = "block";
                
                setTimeout(() => {
                    if (routePolylineLayer.getLayers().length > 0) {
                        let group = new L.FeatureGroup(routePolylineLayer.getLayers());
                        map.fitBounds(group.getBounds(), { padding: [50, 50] });
                    }
                }, 500);
            } else {
                let coordString = coords.map(c => `${c[1]},${c[0]}`).join(';');
                let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

                try {
                    let response = await fetch(osrmUrl);
                    let data = await response.json();

                    if (data.routes && data.routes.length > 0) {
                        let routeData = data.routes[0];
                        let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                        let totalKm = (routeData.distance / 1000).toFixed(1);
                        badge.innerText = `🏁 Total: ${totalKm} KM`;
                        badge.style.display = "block";

                        let roadPolyline = L.polyline(routeCoords, {
                            color: pinColor, 
                            weight: 2,
                            opacity: 0.85
                        });

                        routePolylineLayer.addLayer(roadPolyline);
                        map.fitBounds(roadPolyline.getBounds());
                    }
                } catch (error) {
                    console.error("Napakyas pagkuha sa OSRM route:", error);
                    badge.style.display = "none";
                }
            }

            loadRidersToMap(selectedKey);
        }

        async function fetchAndDrawOSRM(coordArray, color) {
            if (coordArray.length < 2) return;
            let coordString = coordArray.map(c => `${c[1]},${c[0]}`).join(';');
            let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

            try {
                let response = await fetch(osrmUrl);
                let data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    let routeData = data.routes[0];
                    let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                    let roadPolyline = L.polyline(routeCoords, {
                        color: color, 
                        weight: 2,
                        opacity: 0.85
                    });
                    
                    routePolylineLayer.addLayer(roadPolyline);
                }
            } catch (error) {
                console.error("Napakyas pagkuha sa OSRM route:", error);
            }
        }

        function refreshLiveRiders() {
            let sel = document.getElementById('routeSelect').value;
            if (sel === 'none') {
                markerLayer.clearLayers();
                routePolylineLayer.clearLayers();
                document.getElementById('distanceBadge').style.display = 'none';
                document.getElementById('riderCountBadge').innerText = 'Riders: 0';
                if(document.getElementById('sosAlertBadge')) document.getElementById('sosAlertBadge').style.display = "none";
            } else {
                loadRidersToMap(sel);
            }
        }

        // ==========================================
        // 4. KUHAON ANG LIVE RIDERS GIKAN SA SUPABASE (rally_scans)
        // ==========================================
        async function loadRidersToMap(selectedRoute = "all") {
            if (selectedRoute === "none") {
                markerLayer.clearLayers();
                document.getElementById('riderCountBadge').innerText = "Riders: 0";
                if(document.getElementById('sosAlertBadge')) document.getElementById('sosAlertBadge').style.display = "none";
                return;
            }

            try {
                let allScans = [];
                let fetchStart = 0;
                let fetchLimit = 1000;
                let isFetching = true;

                while (isFetching) {
                    let { data, error } = await supabaseLiveClient
                        .from('rally_scans')
                        .select('*')
                        .range(fetchStart, fetchStart + fetchLimit - 1)
                        .order('scanned_at', { ascending: true });

                    if (error) {
                        console.error("Error sa pagkuha gikan sa Supabase:", error.message);
                        break;
                    }

                    if (data && data.length > 0) {
                        allScans.push(...data);
                        if (data.length < fetchLimit) { isFetching = false; } 
                        else { fetchStart += fetchLimit; }
                    } else { isFetching = false; }
                }

                if (allScans.length === 0) {
                    markerLayer.clearLayers();
                    document.getElementById('riderCountBadge').innerText = "Riders: 0";
                    return;
                }

                let latestRidersMap = {};
                allScans.forEach(rider => {
                    let rId = rider.qr_code || rider.idNum;
                    if (rId) { latestRidersMap[rId] = rider; }
                });

                markerLayer.clearLayers();

                let validRiderCount = 0;
                let activeSOSCount = 0;

                Object.values(latestRidersMap).forEach(rider => {
                    let rId = rider.qr_code || rider.idNum;
                    let lat = parseFloat(rider.latitude);
                    let lon = parseFloat(rider.longitude);
                    let routeKey = (rider.rider_level || "G5").toUpperCase();
                    
                    // 🎯 KOREHIYO SA FILTERING LOGIC DEPENDI SA LOGIN ROLE:
                    if (selectedRoute.toLowerCase() === "all") {
                        if (currentUserRole.isAdmin) {
                            // 🌟 ADMIN: Makita TANANG riders sa tanang ruta!
                        } else if (currentUserRole.isMarshal) {
                            // 🛡️ MARSHAL: G81, G3, ug G5 ra ang makita sa "all" view
                            if (!["G81", "G3", "G5"].includes(routeKey)) return;
                        } else {
                            // 👤 REGULAR USER: Ang iya ra nga assigned route level
                            if (routeKey !== currentUserRole.userLevel) return;
                        }
                    } else {
                        // 📌 SPECIFIC ROUTE OPTION: Ang napili ra nga ruta ang makita
                        if (routeKey !== selectedRoute.toUpperCase()) return;
                    }

                    if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
                        validRiderCount++;

                        let vehicleName = "Wala Gibutang";
                        if (typeof riderDatabase !== 'undefined') {
                            let matchingRider = riderDatabase.find(r => String(r.idNum) === String(rId));
                            if (matchingRider && matchingRider.vehicle) {
                                vehicleName = matchingRider.vehicle;
                            }
                        }

                        let formattedTime = "Wala";
                        if (rider.scanned_at || rider.created_at) {
                            let d = new Date(rider.scanned_at || rider.created_at);
                            formattedTime = d.toLocaleString('en-PH', {
                                timeZone: 'Asia/Manila',
                                month: 'short', day: 'numeric',
                                hour: '2-digit', minute: '2-digit', hour12: false
                            });
                        }

                        // 🚨 CHECK KUNG SOS KINI NGA SCAN
                        let isSOS = (rider.checkpoint && rider.checkpoint.includes("SOS")) || rider.is_sos === true;
                        let markerIcon;

                        if (isSOS) {
                            activeSOSCount++;
                            markerIcon = createSOSIcon(); 
                        } else {
                            let pinColor = routeColors[routeKey] || "#ff9900"; 
                            markerIcon = createColoredIcon(pinColor);
                        }

                        let marker = L.marker([lat, lon], { icon: markerIcon });

                        let emergencyHeader = isSOS ? `<div style="background:#cc0000; color:white; padding:4px; text-align:center; font-weight:bold; border-radius:3px; margin-bottom:5px;">🚨 EMERGENCY SOS DISTRESS SIGNAL!</div>` : '';

                        // 🔘 BUTTON PARA SA ADMIN / MARSHAL ARON MKA-CLEAR SA SOS
                        let resolveBtn = '';
                        if (isSOS && (currentUserRole.isAdmin || currentUserRole.isMarshal)) {
                            resolveBtn = `
                                <button onclick="resolveSOS('${rId}')" style="background:#28a745; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; margin-top:8px; font-weight:bold; width:100%; text-transform:uppercase; font-size:11px;">
                                    ✅ Mark as Resolved (Clear SOS)
                                </button>
                            `;
                        }

                        marker.bindPopup(`
                            <div style="color: black; font-family: Arial; font-size: 13px;">
                                ${emergencyHeader}
                                <b>🏍️ ID: ${rId}</b><br>
                                👤 Pangalan: <b>${rider.rider_name || "Rider"}</b><br>
                                🛵 Motor: <b style="color:#0066cc;">${vehicleName}</b><br>
                                📍 Checkpoint: <b style="color:${isSOS ? 'red' : 'black'};">${rider.checkpoint}</b><br>
                                🛣️ Rota: <b style="background: #222; padding: 2px 5px; border-radius: 3px; color:white;">${routeKey}</b><br>
                                ⚙️ Odometer: ${rider.odometer} KM<br>
                                🕒 Oras: ${formattedTime}<br>
                                📝 Notes: <b style="color:${isSOS ? 'red' : 'black'};">${rider.notes || 'Wala'}</b><br>
                                📸 <a href="${rider.photo_url}" target="_blank" style="color:blue; font-weight:bold;">Tan-awa ang Ebidensya</a><br>
                                <a href="${rider.location_address}" target="_blank">🗺️ Google Maps Location</a>
                                ${resolveBtn}
                            </div>
                        `); 

                        markerLayer.addLayer(marker);

                        if (isSOS) {
                            marker.openPopup();
                        }
                    }
                });

                document.getElementById('riderCountBadge').innerText = `Riders: ${validRiderCount}`;

                let sosBadge = document.getElementById('sosAlertBadge');
                if (sosBadge) {
                    if (activeSOSCount > 0) {
                        sosBadge.innerText = `🚨 SOS EMERGENCY: ${activeSOSCount}`;
                        sosBadge.style.display = "inline-block";
                    } else {
                        sosBadge.style.display = "none";
                    }
                }

            } catch (err) {
                console.error("Critical error sa pag-load sa map markers:", err);
            }
        }

        // ==========================================
        // 🚀 INITIALIZATION LOGIC
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // Tagoan usab ang dropdown options samtang wala pa nakapasa sa passcode
            let selectElem = document.getElementById('routeSelect');
            for (let option of selectElem.options) {
                option.style.display = "none";
            }

            // Auto-refresh loop kada 30 seconds
            setInterval(() => {
                let modal = document.getElementById('passcodeModal');
                if (modal && modal.style.display === 'none') {
                    let sel = document.getElementById('routeSelect').value;
                    if (sel !== 'none') {
                        loadRidersToMap(sel);
                    }
                }
            }, 30000);
        });

        // ==========================================
        // 🛠️ RESOLVE / CLEAR SOS ALERT FUNCTION
        // ==========================================
        async function resolveSOS(rId) {
            if (!currentUserRole.isAdmin && !currentUserRole.isMarshal) {
                alert("🔒 Admin o Marshal ra ang maka-resolve sa SOS alert!");
                return;
            }

            if (confirm(`Sigurado ka nga natabangan ug resolved na ang SOS alang sa Rider #${rId}?`)) {
                try {
                    // I-update ang pinakabag-o nga scan record sa rider sa Supabase
                    const { error } = await supabaseLiveClient
                        .from('rally_scans')
                        .update({ 
                            is_sos: false, 
                            checkpoint: 'SOS RESOLVED',
                            notes: 'OK / RESOLVED BY COMMAND CENTER'
                        })
                        .eq('qr_code', rId);

                    if (error) {
                        alert("❌ Napakyas sa pag-update: " + error.message);
                    } else {
                        alert(`✅ Na-clear ug na-resolve na ang SOS signal ni Rider #${rId}!`);
                        refreshLiveRiders(); // Awtomatiko nga i-refresh ang mapa
                    }
                } catch (err) {
                    console.error("Error sa resolveSOS:", err);
                    alert("❌ Naay error sa pag-process sa request.");
                }
            }
        }

</script>
</body>
