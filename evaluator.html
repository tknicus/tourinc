<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP - Supabase Rider Report (Evaluate)</title>

    <!-- HTML2Canvas (Para ma-download as Picture) -->

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #111; }
        
        /* 🛡️ ADMIN PORTAL LOGIN SCREEN STYLES */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; box-sizing: border-box; }
        .auth-card { background: #1e1e1e; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); text-align: center; width: 100%; max-width: 330px; border: 1px solid #333; }
        .auth-card h3 { color: #fff; margin-bottom: 5px; font-style: italic; font-size: 20px; }
        .auth-card p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px; font-size: 18px; text-align: center; border: 1px solid #444; border-radius: 5px; background: #121212; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-weight: bold; letter-spacing: 5px; outline: none; }
        .auth-card input:focus { border-color: #cc0000; }
        .auth-card button { width: 100%; padding: 15px; background-color: #cc0000; color: white; border: 2px solid #aa0000; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; transition: 0.3s; }
        .auth-card button:hover { background-color: #ff0000; }

        .report-wrapper { max-width: 1300px; margin: 0 auto; background: #ffffff; padding: 15px; border: 1px solid #b5b5b5; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: none; } 
        
        /* CONTROL PANEL */
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: white; }
        .control-panel label { font-weight: bold; }
        .control-panel input[type="text"] { padding: 10px 12px; font-size: 16px; border: 1px solid #444; border-radius: 4px; flex: 1; min-width: 180px; background: #2a2a2a; color: white; text-align: left; letter-spacing: normal; font-weight: normal; }
        .control-panel select { padding: 10px 12px; font-size: 16px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: white; cursor: pointer; }
        .control-panel button { padding: 10px 20px; background: #cc0000; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
        
        @media (min-width: 600px) { .control-panel button { width: auto; } }
        .control-panel button:hover { background: #990000; }

        /* ACTION BUTTONS (PRINT & PICTURE) */
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; }
        @media (min-width: 600px) { .action-buttons { width: auto; margin-left: auto; } }
        
        #printBtn { background: #0077cc; flex: 1; }
        #printBtn:hover { background: #005599; }
        
        #picBtn { background: #28a745; flex: 1; }
        #picBtn:hover { background: #218838; }

        /* AREA NGA I-CAPTURE PARA SA PICTURE */
        #captureArea { 
            padding: 10px; 
            background-color: #ffffff; 
            position: relative; 
            overflow: hidden; 
        }

        /* 🌊 WATERMARK LOGO STYLES */
        .watermark-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 950px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: multiply;
        }

        /* EXCEL HEADER & TABLE Z-INDEX */
        .excel-header { display: flex; flex-direction: column; gap: 12px; border: 2px solid #000; padding: 12px; background: rgba(253, 253, 253, 0.85); margin-bottom: 15px; position: relative; z-index: 1; }
        .profile-side { width: 100%; font-size: 13px; font-family: Arial, sans-serif; color: #000000; }
        .profile-side div { margin-bottom: 6px; word-break: break-word; font-weight: normal; color: #000000; }
        .profile-side b { display: inline-block; width: 150px; font-weight: normal; color: #555555; }
        
        .summary-side { border: 2px solid #000000; width: 100%; background: #ffffff; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; font-family: Arial, sans-serif; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #000000; padding: 8px 12px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-row span { color: #555555; }
        .summary-row b { text-align: right; color: #000000; }

        @media (min-width: 768px) {
            .excel-header { flex-direction: row; justify-content: space-between; align-items: stretch; }
            .profile-side { flex: 1; width: auto; }
            .summary-side { width: 330px; min-width: 330px; flex-shrink: 0; }
        }

        /* TABLE */
        .table-container { width: 100%; overflow-x: auto; margin-top: 10px; position: relative; z-index: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: Arial, sans-serif; min-width: 1250px; background: rgba(255, 255, 255, 0.85); }
        th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: middle; }
        th { background-color: #d9d9d9; text-align: center; font-weight: bold; color: #000; }
        .center { text-align: center; }
        .no-data { text-align: center; padding: 40px; font-size: 16px; color: #666; font-style: italic; }
        .photo-link { color: #0066cc; text-decoration: none; font-weight: bold; }

        /* EVALUATION CONTROLS */
        .status-dropdown { padding: 4px; font-weight: bold; border-radius: 4px; border: 1px solid #000; cursor: pointer; outline: none; width: 110px; }
        .status-Pending { background-color: #ffc107; color: #000; }
        .status-Valid { background-color: #28a745; color: #fff; }
        .status-PAUSE { background-color: #ff9900; color: #000; }
        .status-RESUME { background-color: #00d2ff; color: #000; }
        .status-Invalid { background-color: #dc3545; color: #fff; }
        .status-Hide { background-color: #6c757d; color: #fff; }
        
        .admin-remark { 
            width: 100%; 
            min-width: 220px; 
            padding: 6px 8px; 
            border: 1px solid #999; 
            border-radius: 3px; 
            font-size: 12px; 
            box-sizing: border-box; 
            background-color: rgba(255,255,255,0.9); 
        }

        .admin-remark:focus { border-color: #cc0000; outline: none; background-color: #fff; }
        
        .row-Pending { background-color: rgba(255, 255, 255, 0.85); }
        .row-Valid { background-color: rgba(212, 237, 218, 0.85); }
        .row-PAUSE { background-color: rgba(255, 243, 205, 0.85); }
        .row-RESUME { background-color: rgba(209, 236, 241, 0.85); }
        .row-Invalid { background-color: rgba(248, 215, 218, 0.85); }
        .row-Hide { background-color: rgba(226, 227, 229, 0.85); color: #777; text-decoration: line-through; }
        .row-Hide input, .row-Hide select { text-decoration: none; }
        
        .toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 5px; padding: 12px; position: fixed; z-index: 1000; right: 20px; bottom: 20px; font-size: 14px; }
        .toast.show { visibility: visible; }

        @media print {
            body { background-color: #ffffff; padding: 0; color: #000; }
            #authOverlay { display: none !important; }
            .report-wrapper { border: none; box-shadow: none; padding: 0; max-width: 100%; width: 100%; display: block !important; }
            .control-panel { display: none !important; }
            .admin-remark { border: none; background: transparent; font-weight: bold; padding: 0; white-space: normal !important; font-size: 12px; }
            .status-dropdown { border: none; background: transparent; -webkit-appearance: none; appearance: none; font-weight: bold; padding: 0; }
            #captureArea { padding: 0; }
        }
    </style>
</head>
<body>

    <!-- 🛡️ ADMIN PORTAL LOGIN SCREEN -->
    <div id="authOverlay">

                <option value="time_submit">⏰ Oras (Date/Time)</option>
                <option value="checkpoint">🚩 Checkpoint (CP 00 - FL)</option>

            <button onclick="generateReport()">Generate gikan sa Database</button>
            
            <div class="action-buttons">
                <button onclick="window.print()" id="printBtn" style="display: none;">🖨️ I-Print (Papel)</button>

            </div>
        </div>

        <div id="reportContent">
            <div class="no-data">I-type ang Rider ID sa ibabaw ug i-klik ang button aron kuhaon ang live data gikan sa Supabase.</div>
        </div>
    </div>

    <div id="snackbar" class="toast">✅ Na-save ang Data sa Database!</div>

    <script src="database.js"></script>
    
    <script>
        // ==========================================
        // ⏱️ AUTO SESSION TIMEOUT (5 MINUTES IDLE)
        // ==========================================
        let idleTimer;
        const IDLE_TIME_LIMIT = 300000; 

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (sessionStorage.getItem("admin_authenticated") === "true") {
                idleTimer = setTimeout(autoLogout, IDLE_TIME_LIMIT);
            }
        }

        function autoLogout() {
            sessionStorage.removeItem("admin_authenticated");
            document.getElementById("mainReportWrapper").style.display = "none";
            document.getElementById("authOverlay").style.display = "flex";
            document.getElementById("adminPassInput").value = ""; 
            alert("⏱️ Naka-standby og dugay ang Evaluator Portal. Na-lock kini alang sa imong seguridad. Palihug login usab.");
        }

        window.onload = resetIdleTimer;
        document.onmousemove = resetIdleTimer;
        document.onkeypress = resetIdleTimer;
        document.ontouchstart = resetIdleTimer;
        document.onclick = resetIdleTimer;
        document.onscroll = resetIdleTimer;

        if (sessionStorage.getItem("admin_authenticated") === "true") {
            document.getElementById("authOverlay").style.display = "none";
            document.getElementById("mainReportWrapper").style.display = "block";
            resetIdleTimer();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                verifyAdminPass();
            }
        }

        async function verifyAdminPass() {
            const userPin = document.getElementById("adminPassInput").value.trim();
            if (!userPin) return;

            if (typeof riderDatabase === 'undefined') {
                alert("⚠️ Error: Wala nabasa ang database.js. Palihug susiha ang file.");
                return;
            }
            
            const encoder = new TextEncoder();
            const data = encoder.encode(userPin);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            // Allow all registered Admin/Marshal passcodes
            let validAdmin = riderDatabase.find(r => r.passcode === hashedInput && (r.isAdmin === true || r.isMarshal === true || r.idNum === "0001" || r.idNum === "0002" || r.idNum === "1636"));
            
            if (validAdmin) {
                sessionStorage.setItem("admin_authenticated", "true");
                document.getElementById("authOverlay").style.display = "none";
                document.getElementById("mainReportWrapper").style.display = "block";
                resetIdleTimer();
                alert(`✅ Husto ang Passcode! Welcome sa Evaluator Portal, Master ${validAdmin.fullname}!`);
            } else {
                alert("❌ Sayop nga Passcode o dili ka awtorisado nga Admin!");
                document.getElementById("adminPassInput").value = ""; 
            }
        }

        const _supabaseUrl = 'https://iilfklquzyxmdergwawh.supabase.co';
        const _supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpbGZrbHF1enl4bWRlcmd3YXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTkzMDcsImV4cCI6MjEwMzI5NTMwN30.jMctz666CGfTdODLqNr24O3dQ5SDM6K5GkmihCtDdBQ';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(_supabaseUrl, _supabaseAnonKey);
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        function formatPhilippineTime(isoString) {
            if (!isoString) return "-";
            try {
                let d = new Date(isoString);
                if (isNaN(d.getTime())) return isoString;

                return d.toLocaleString('en-US', {
                    timeZone: 'Asia/Manila',
                    year: 'numeric',
                    month: 'numeric',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: 'numeric',
                    second: 'numeric',
                    hour12: true
                });
            } catch (err) {
                return isoString;
            }
        }

        async function generateReport() {
            const targetId = document.getElementById('searchIdInput').value.trim();
            const container = document.getElementById('reportContent');
            const printBtn = document.getElementById('printBtn');
            const picBtn = document.getElementById('picBtn');

            if (printBtn) printBtn.style.display = "none";
            if (picBtn) picBtn.style.display = "none";

            if (!targetId) { alert("Palihug isulod ang Rider ID!"); return; }
            if (!supabaseClient) { container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Error: Wala na-initialize ang Supabase client.</div>`; return; }

            container.innerHTML = `<div class="no-data">🔄 Gipangita ang ID #${targetId} sa Database Table para i-evaluate...</div>`;

            try {
                let targetNum = parseInt(targetId) || targetId;
                let sortOption = document.getElementById('sortByDropdown').value;

                let riderInfo = null;
                if (typeof riderDatabase !== 'undefined' && Array.isArray(riderDatabase)) {
                    riderInfo = riderDatabase.find(r => String(r.idNum) === String(targetId) || String(r.idNum) === String(targetNum));
                }

                let { data: scans, error } = await supabaseClient
                    .from('rally_scans')
                    .select('*')
                    .or(`qr_code.eq.${targetId},qr_code.eq.${targetNum}`);

                if (error) throw new Error(error.message);

                if (!scans || scans.length === 0) {
                    container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Walay nakit-an nga record sa rally_scans para sa Rider ID #${targetId}.</div>`;
                    return;
                }

                if (sortOption === 'time_submit') {
                    scans.sort((a, b) => new Date(a.time_submit) - new Date(b.time_submit));
                } else if (sortOption === 'checkpoint') {
                    scans.sort((a, b) => {
                        let cpA = String(a.checkpoint || "");
                        let cpB = String(b.checkpoint || "");
                        if (cpA === cpB) {
                            return new Date(a.time_submit) - new Date(b.time_submit);
                        }
                        return cpA.localeCompare(cpB);
                    });
                }

                let fullName = riderInfo ? (riderInfo.fullname || riderInfo.name) : (scans[0].rider_name || 'Wala sa Masterlist');
                let riderLevel = riderInfo ? riderInfo.level : (scans[0].rider_level || 'AS26');
                let codeName = riderInfo ? (riderInfo.nickname || 'N/A') : 'N/A';
                let vehicleName = riderInfo ? (riderInfo.vehicle || 'N/A') : (scans[0].vehicle || 'N/A');

                let routeFullName = riderLevel; 
                if (typeof routeNames !== 'undefined' && routeNames[riderLevel]) {
                    routeFullName = routeNames[riderLevel]; 
                }

                let activeScans = scans.filter(scan => {
                    let st = String(scan.status || scan.evaluation || '').toUpperCase();
                    return st !== 'HIDE' && st !== 'HIDDEN';
                });

                let calcScans = activeScans.length > 0 ? activeScans : scans;
                let chronologicalScans = [...calcScans].sort((a, b) => new Date(a.time_submit) - new Date(b.time_submit));
                
                let firstScanTime = new Date(chronologicalScans[0].time_submit);
                let lastScanTime = new Date(chronologicalScans[chronologicalScans.length - 1].time_submit);
                let rawDiffMs = lastScanTime - firstScanTime; // Raw Total Time

                // ==========================================
                // ⏱️ EKSATONG PAG-DEDUCT SA PAUSE HANGTOD RESUME
                // ==========================================
                let totalPauseDeductionMs = 0;
                let activePauseTime = null;

                chronologicalScans.forEach((scan) => {
                    let cpName = String(scan.checkpoint || '').toUpperCase();
                    let evalStatus = String(scan.status || '').toUpperCase();
                    let adminRemark = String(scan.eval_remarks || '').toUpperCase();
                    let scanNotes = String(scan.notes || '').toUpperCase();

                    let isPause = cpName.includes('PAUSE') || evalStatus.includes('PAUSE') || scanNotes.includes('[PAUSE]');
                    let isResume = cpName.includes('RESUME') || evalStatus.includes('RESUME') || scanNotes.includes('[RESUME]');
                    let isMechanical = adminRemark.includes('MECHANICAL') || adminRemark.includes('MOTOR') || scanNotes.includes('MECHANICAL');

                    // 1. Inig-start sa PAUSE (basta dili Mechanical Breakdown)
                    if (isPause && !isMechanical) {
                        if (!activePauseTime) {
                            activePauseTime = new Date(scan.time_submit);
                        }
                    } 
                    // 2. Inig-RESUME sa Rider (o inig scan sa sunod CP human sa Pause)
                    else if (activePauseTime && (isResume || !isPause)) {
                        let pauseEndTime = new Date(scan.time_submit);
                        let duration = pauseEndTime - activePauseTime;
                        
                        if (duration > 0) {
                            totalPauseDeductionMs += duration;
                        }
                        activePauseTime = null;
                    }
                });

                // EFFECTIVE RUNNING TIME (TOTAL TIME MINUS TOTAL PAUSE DURATION)
                let effectiveDiffMs = Math.max(0, rawDiffMs - totalPauseDeductionMs);

                // Format sa Oras: HH:MM:SS
                let totalHours = Math.floor(effectiveDiffMs / (1000 * 60 * 60));
                let totalMinutes = Math.floor((effectiveDiffMs % (1000 * 60 * 60)) / (1000 * 60));
                let totalSeconds = Math.floor((effectiveDiffMs % (1000 * 60)) / 1000);
                let runningTimeFormatted = `${String(totalHours).padStart(2, '0')}:${String(totalMinutes).padStart(2, '0')}:${String(totalSeconds).padStart(2, '0')} hms`;

                // Format sa Bawas nga Oras (Pause Time Display)
                let pauseHours = Math.floor(totalPauseDeductionMs / (1000 * 60 * 60));
                let pauseMinutes = Math.floor((totalPauseDeductionMs % (1000 * 60 * 60)) / (1000 * 60));
                let pauseTimeFormatted = `${pauseHours}h ${pauseMinutes}m`;

                let startOdo = parseFloat(chronologicalScans[0].odometer) || 0;
                let endOdo = parseFloat(chronologicalScans[chronologicalScans.length - 1].odometer) || startOdo;
                let totalDistance = endOdo >= startOdo ? (endOdo - startOdo) : endOdo;

                let speedValNum = effectiveDiffMs > 0 ? (totalDistance / (effectiveDiffMs / (1000 * 60 * 60))) : 0;
                let speedVal = speedValNum > 0 ? speedValNum.toFixed(2) : "0.00";

                let targetRouteKm = 655; 
                if (typeof routeDistances !== 'undefined' && routeDistances[riderLevel]) {
                    targetRouteKm = parseFloat(routeDistances[riderLevel]);
                }

                let remainingKm = Math.max(0, targetRouteKm - totalDistance);
                let etaFormatted = "N/A";

                if (remainingKm === 0) {
                    etaFormatted = "🏁 ARRIVED (FINISHED)";
                } else if (speedValNum > 0 && lastScanTime) {
                    let hoursNeeded = remainingKm / speedValNum;
                    let etaTimeMs = lastScanTime.getTime() + (hoursNeeded * 60 * 60 * 1000);
                    let etaDate = new Date(etaTimeMs);
                    etaFormatted = formatPhilippineTime(etaDate.toISOString());
                } else {
                    etaFormatted = "⏳ N/A (Stationary)";
                }

                let html = `<div id="captureArea">
                    <!-- 🌊 WATERMARK IMAGE -->
                    <img src="mmc.png" class="watermark-bg" alt="Watermark Logo">

                    <div class="excel-header">
                        <div class="profile-side">
                            <div><b>id number</b> <span style="font-size: 16px; font-weight: bold; color: #0000cc;">${targetId}</span></div>
                            <div><b>code name</b> ${codeName}</div>
                            <div><b>fullname</b> ${fullName}</div>
                            <div><b>motor vehicle</b> ${vehicleName}</div>
                            <div><b>Route Name</b> ${routeFullName}</div>
                            <div><b>Total Checkpoints</b> ${scans.length}</div>
                        </div>
                        <div class="summary-side">
                            <div class="summary-row"><span>running time</span><b>${runningTimeFormatted}</b></div>
                            <div class="summary-row"><span>pause deducted</span><b style="color: #ff9900;">-${pauseTimeFormatted}</b></div>
                            <div class="summary-row"><span>distance covered</span><b>${totalDistance} km</b></div>
                            <div class="summary-row"><span>target route</span><b>${targetRouteKm} km</b></div>
                            <div class="summary-row"><span>average speed</span><b>${speedVal} kph</b></div>
                            <div class="summary-row" style="background-color: #fffde7;">
                                <span style="font-weight: bold; color: #cc0000;">EST. ARRIVAL (ETA)</span>
                                <b style="color: #cc0000; font-size: 12px;">${etaFormatted}</b>
                            </div>
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 20px;">#</th>
                                    <th>CHECKPOINTS</th>
                                    <th style="width: 130px;">TIME (SCANNED AT)</th>
                                    <th style="width: 45px;">ODO</th>
                                    <th style="width: 85px;">COORDINATES</th>
                                    <th style="width: 65px;">EBIDENSYA</th>
                                    <th style="width: 90px;">REMARKS / NOTES</th>
                                    <th style="width: 350px; background-color: #cc0000; color: white;">ADMIN REMARKS</th>
                                    <th style="width: 90px; background-color: #cc0000; color: white;">EVALUATION</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                scans.forEach((scan, index) => {
                    let formattedDate = formatPhilippineTime(scan.time_submit);
                    let rLevel = riderInfo ? riderInfo.level : (scan.rider_level || 'AS26');
                    let cpCode = String(scan.checkpoint || '').trim();
                    let locationName = '';

                    if (typeof routeCheckpoints !== 'undefined') {
                        if (routeCheckpoints[rLevel] && routeCheckpoints[rLevel][cpCode]) {
                            locationName = routeCheckpoints[rLevel][cpCode];
                        } else if (routeCheckpoints["AS26"] && routeCheckpoints["AS26"][cpCode]) {
                            locationName = routeCheckpoints["AS26"][cpCode];
                        }
                    }
                    if (!locationName) locationName = scan.notes || ''; 

                    let photoLinkText = (scan.photo_url && scan.photo_url.startsWith('http')) 
                        ? `<a href="${scan.photo_url}" target="_blank" class="photo-link">📷 Tan-awa</a>` 
                        : `<span style="color:#888;">N/A</span>`;

                    let rawLat = scan.latitude || scan.lat;
                    let rawLon = scan.longitude || scan.lon || scan.lng;
                    let coordsDisplay = '<span style="color:#aaa;">N/A</span>';
                    
                    if (rawLat && rawLon) {
                        let latFormat = parseFloat(rawLat).toFixed(6);
                        let lonFormat = parseFloat(rawLon).toFixed(6);
                        coordsDisplay = `<a href="https://www.google.com/maps?q=${rawLat},${rawLon}" target="_blank" title="Tan-awa sa Mapa" style="color:#0277bd; text-decoration:none; font-family:monospace; font-size:11px; display:inline-block; line-height:1.3;"><b>${latFormat},<br>${lonFormat}</b></a>`;
                    }

                    let evalStatus = scan.status || 'Pending'; 
                    let evalRemarks = scan.eval_remarks || '';
                    
                    html += `
                        <tr id="row-${scan.id}" class="row-${evalStatus}">
                            <td class="center">${index + 1}</td>
                            <td><b>${scan.checkpoint}</b> - ${locationName}</td>
                            <td class="center">${formattedDate}</td>
                            <td class="center">${scan.odometer || 0}</td>
                            <td class="center">${coordsDisplay}</td>
                            <td class="center">${photoLinkText}</td>
                            <td>${scan.notes || '-'}</td>
                            <td class="center">
                                <input type="text" id="rem-${scan.id}" class="admin-remark" value="${evalRemarks}" placeholder="Ibutang ang rason..." onblur="saveEvaluation('${scan.id}')" onkeypress="if(event.key === 'Enter') this.blur();">
                            </td>
                            <td class="center">
                                <select id="stat-${scan.id}" class="status-dropdown status-${evalStatus}" onchange="saveEvaluation('${scan.id}')">
                                    <option value="Pending" ${evalStatus === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                                    <option value="Valid" ${evalStatus === 'Valid' ? 'selected' : ''}>✅ Valid</option>
                                    <option value="PAUSE" ${evalStatus === 'PAUSE' ? 'selected' : ''}>⏸️ PAUSE</option>
                                    <option value="RESUME" ${evalStatus === 'RESUME' ? 'selected' : ''}>▶️ RESUME</option>
                                    <option value="Invalid" ${evalStatus === 'Invalid' ? 'selected' : ''}>❌ Invalid</option>
                                    <option value="Hide" ${evalStatus === 'Hide' ? 'selected' : ''}>👁️‍🗨️ Hide / Ignore</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div> <!-- End of table-container -->
                </div> <!-- End of captureArea -->
                `;

                container.innerHTML = html;

                if (printBtn) printBtn.style.display = "block";
                if (picBtn) picBtn.style.display = "block";

            } catch (err) {
                console.error("Report Generation Error:", err);
                container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Naay error nga nahitabo: <b>${err.message}</b></div>`;
            }
        }

        async function saveEvaluation(recordId) {
            const statElement = document.getElementById(`stat-${recordId}`);
            const remElement = document.getElementById(`rem-${recordId}`);
            const trElement = document.getElementById(`row-${recordId}`);
            
            if (!statElement || !remElement) return;

            const newStatus = statElement.value;
            const newRemark = remElement.value;

            statElement.disabled = true;
            remElement.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('rally_scans')
                    .update({ 
                        status: newStatus,
                        eval_remarks: newRemark
                    })
                    .eq('id', recordId);

                if (error) throw error;

                if (trElement) trElement.className = `row-${newStatus}`;
                statElement.className = `status-dropdown status-${newStatus}`;
                
                showToast();

            } catch (err) {
                console.error("Save Evaluation Error:", err);
                alert("❌ Wala na-save sa Database! Error: " + err.message);
            } finally {
                statElement.disabled = false;
                remElement.disabled = false;
            }
        }

        function showToast() {
            const x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("toast show", "toast"); }, 3000);
        }

        function downloadAsPicture() {
            const captureDiv = document.getElementById('captureArea');
            const targetId = document.getElementById('searchIdInput').value.trim() || 'EvalReport';
            const picBtn = document.getElementById('picBtn');
            
            if (!captureDiv) return;

            const originalText = picBtn.innerHTML;
            picBtn.innerHTML = "⏳ Nag-capture...";
            picBtn.disabled = true;

            html2canvas(captureDiv, {
                scale: 2, 
                backgroundColor: "#ffffff",
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Evaluation_${targetId}_Report.png`; 
                link.href = canvas.toDataURL('image/png');
                link.click();

                picBtn.innerHTML = originalText;
                picBtn.disabled = false;
            }).catch(err => {
                console.error("Naay error sa pag-capture: ", err);
                alert("Pasayloa, adunay error sa paghimo sa picture.");
                picBtn.innerHTML = originalText;
                picBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
