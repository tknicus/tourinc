<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Finder / Hash Decoder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        h2 { color: #ffcc00; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; font-size: 14px; border-radius: 5px; border: none; text-align: center; background: #2a2a2a; color: #00ff00; }
        button { width: 100%; padding: 15px; background-color: #cc0000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #ff0000; }
        .result { margin-top: 20px; font-size: 20px; font-weight: bold; color: #00d2ff; background: #121212; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🕵️‍♂️ PIN Finder (Brute-Force)</h2>
        <p style="font-size: 12px; color: #aaa;">I-paste ang Custom Hash (cypherHash) dire aron pangitaon ang original nga PIN (0000 - 999999).</p>
        
        <input type="text" id="hashInput" placeholder="I-paste ang Hash dire...">
        <button onclick="findPIN()">PANGITAA ANG PIN</button>
        
        <div id="resultBox" class="result">Resulta: ----</div>
    </div>

    <script>
        // Imong original nga Custom Hash algorithm
        function cypherHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31) + str.charCodeAt(i);
                hash = hash | 0;
            }
            return hash.toString();
        }

        function findPIN() {
            const targetHash = document.getElementById("hashInput").value.trim();
            const resultBox = document.getElementById("resultBox");
            
            if (!targetHash) {
                alert("Palihug butangi og Hash!");
                return;
            }

            resultBox.style.color = "#ffcc00";
            resultBox.innerText = "Gipangita... Palihug paghulat.";

            // Gi-delay gamay aron makita ang "Gipangita..." nga text
            setTimeout(() => {
                let found = false;

                // Testingan nato ang tanang numbers gikan 0 hantod 999,999
                for (let i = 0; i <= 999999; i++) {
                    let numStr = i.toString();
                    
                    // Testingan kung naay zero sa atubangan (e.g., 0001, 0123)
                    let pinFormats = [
                        numStr,
                        numStr.padStart(4, '0'), // 4-digit (0001)
                        numStr.padStart(5, '0'), // 5-digit (00001)
                        numStr.padStart(6, '0')  // 6-digit (000001)
                    ];

                    for (let pin of pinFormats) {
                        if (cypherHash(pin) === targetHash) {
                            resultBox.style.color = "#00ff00";
                            resultBox.innerText = `✅ PIN NAKIT-AN: ${pin}`;
                            found = true;
                            return; // Ihunong ang pagpangita kung nakit-an na
                        }
                    }
                }

                if (!found) {
                    resultBox.style.color = "#ff0000";
                    resultBox.innerText = "❌ Wala nakit-an sa 0-999999 range.";
                }
            }, 100);
        }
    </script>
</body>
</html>
