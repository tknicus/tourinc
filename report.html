<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP - Official Rider Report</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #111; }
        .report-wrapper { max-width: 1050px; margin: 0 auto; background: #ffffff; padding: 25px; border: 1px solid #b5b5b5; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        /* Search Control Panel */
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; color: white; }
        .control-panel input { padding: 10px 12px; font-size: 16px; border: 1px solid #444; border-radius: 4px; width: 220px; background: #2a2a2a; color: white; }
        .control-panel button { padding: 10px 20px; background: #cc0000; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .control-panel button:hover { background: #990000; }

        /* Excel-like Header Layout */
        .excel-header { display: flex; justify-content: space-between; border: 2px solid #000; padding: 12px; background: #fdfdfd; margin-bottom: 15px; }
        .profile-side div { margin-bottom: 6px; font-size: 14px; font-family: 'Courier New', Courier, monospace; }
        .profile-side b { display: inline-block; width: 110px; color: #333; }
        
        /* Summary Box (Top Right) */
        .summary-side { border: 2px solid #000; width: 280px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; font-family: Arial, sans-serif; }
        .summary-row { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding: 6px 10px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-row b { text-align: right; }

        /* Excel Data Table */
        table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: Arial, sans-serif; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; }
        th { background-color: #d9d9d9; text-align: center; font-weight: bold; color: #000; }
        .center { text-align: center; }
        .right { text-align: right; }
        
        .no-data { text-align: center; padding: 40px; font-size: 16px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="report-wrapper">
        <!-- 🔍 SEARCH BAR -->
        <div class="control-panel">
            <label style="font-weight: bold;">RIDER ID:</label>
            <input type="text" id="searchIdInput" placeholder="Pananglitan: 1604 o 0001">
            <button onclick="generateReport()">I-Generate ang Report</button>
        </div>

        <!-- 📊 REPORT OUTPUT AREA -->
        <div id="reportContent">
            <div class="no-data">I-type ang Rider ID sa ibabaw ug i-klik ang button aron makita ang Excel-like report.</div>
        </div>
    </div>

    <!-- Gikuha nato ang database sa mga riders -->
    <script src="database.js"></script>
    <script>
        function generateReport() {
            const targetId = document.getElementById('searchIdInput').value.trim();
            const container = document.getElementById('reportContent');

            if (!targetId) {
                alert("Palihug isulod ang Rider ID!");
                return;
            }

            if (typeof riderDatabase === 'undefined') {
                alert("Wala makit-an ang database.js!");
                return;
            }

            // Pangitaon ang rider sa database
            const rider = riderDatabase.find(r => r.idNum === targetId);
            if (!rider) {
                container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Ang Rider ID #${targetId} kay wala makit-an sa masterlist.</div>`;
                return;
            }

            // Kuhaon ang data gikan sa localStorage (mga na-save nga check-ins / history)
            let riderHistoryKey = 'history_' + targetId;
            let completedCheckpoints = JSON.parse(localStorage.getItem(riderHistoryKey)) || [];
            
            // Kon naa man gani offline data nga na-save sa lokal
            let offlineData = JSON.parse(localStorage.getItem('offlineData')) || [];
            let riderScans = offlineData.filter(item => item.idNum === targetId);

            // Mock o sample computation para sa Excel report display kung bag-o pa
            let totalKm = routeTotalKm ? (routeTotalKm[rider.level] || 655) : 655;
            let totalTimeStr = "37:11:13 hms";
            let avgSpeed = "17.61 kph";

            // Himoon nato ang Excel-like layout
            let html = `
                <div class="excel-header">
                    <div class="profile-side">
                        <div><b>id number</b> <span style="font-size: 16px; font-weight: bold; color: #0000cc;">${rider.idNum}</span></div>
                        <div><b>code name</b> ${rider.codename || rider.fullname || 'N/A'}</div>
                        <div><b>fullname</b> ${rider.fullname}</div>
                        <div style="margin-top: 10px; font-size: 12px; color: #555;"><b>Category:</b> ${rider.level || 'LONEWOLF'} &nbsp;|&nbsp; <b>Motorcycle:</b> ${rider.motorcycle || 'HONDA'}</div>
                    </div>
                    <div class="summary-side">
                        <div class="summary-row"><span>running time</span><b>${totalTimeStr}</b></div>
                        <div class="summary-row"><span>distance</span><b>${totalKm} km</b></div>
                        <div class="summary-row"><span>average speed</span><b>${avgSpeed}</b></div>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" style="width: 40px;">#</th>
                            <th rowspan="2">CHECKPOINTS</th>
                            <th rowspan="2" style="width: 140px;">TIME</th>
                            <th rowspan="2" style="width: 80px;">RUN</th>
                            <th rowspan="2" style="width: 70px;">ODO</th>
                            <th colspan="3">RUNNING</th>
                            <th colspan="3">point to point</th>
                        </tr>
                        <tr>
                            <th style="width: 60px;">kms</th>
                            <th style="width: 60px;">km/h</th>
                            <th style="width: 60px;">kms</th>
                            <th style="width: 70px;">ave km/h</th>
                            <th style="width: 70px;">hours</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Kung naay history o mga na-scan, i-display sa table
            if (completedCheckpoints.length > 0) {
                completedCheckpoints.forEach((cp, index) => {
                    html += `
                        <tr>
                            <td class="center">${index + 1}</td>
                            <td>📍 Checkpoint: ${cp}</td>
                            <td class="center">2026-06-27 09:49:37</td>
                            <td class="center">05:30:43</td>
                            <td class="center">63105</td>
                            <td class="center">146</td>
                            <td class="center">26.49</td>
                            <td class="center">9</td>
                            <td class="center">13.49</td>
                            <td class="center">00:40</td>
                        </tr>
                    `;
                });
            } else {
                html += `
                    <tr>
                        <td colspan="10" class="center" style="padding: 20px; color: #777;">Walay pay na-record nga checkpoints kining ridera sa sistema. (Sample data ra kini sa ubos)</td>
                    </tr>
                    <tr>
                        <td class="center">09</td>
                        <td>Pipisan Bridge, Sitio Pipisan, Brgy. Gipitan</td>
                        <td class="center">06/27/2026 09:49:37</td>
                        <td class="center">5:30:43</td>
                        <td class="center">63105</td>
                        <td class="center">146</td>
                        <td class="center">26.49</td>
                        <td class="center">9</td>
                        <td class="center">13.49</td>
                        <td class="center">00:40</td>
                    </tr>
                    <tr>
                        <td class="center">48</td>
                        <td>ELKAPITAN's Headstone (Finish Line)</td>
                        <td class="center">06/28/2026 17:30:07</td>
                        <td class="center">37:11:13</td>
                        <td class="center">63614</td>
                        <td class="center">655</td>
                        <td class="center">17.61</td>
                        <td class="center">48</td>
                        <td class="center">50.97</td>
                        <td class="center">00:56</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
