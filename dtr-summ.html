<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP - DTR Summary Grid</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #111; }
        .report-wrapper { max-width: 100%; margin: 0 auto; background: #ffffff; padding: 15px; border: 1px solid #b5b5b5; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        /* 📱 SEARCH CONTROL PANEL */
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: white; }
        .control-panel label { font-weight: bold; }
        .control-panel select { padding: 10px; font-size: 16px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: white; min-width: 200px; }
        .control-panel button { padding: 10px 20px; background: #cc0000; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .control-panel button:hover { background: #990000; }

        /* 📊 DTR TABLE & STICKY COLUMNS */
        .table-container { width: 100%; max-height: 80vh; overflow: auto; border: 1px solid #000; position: relative; }
        
        /* SECRETO ARON DILI MA-SQUEEZE ANG TABLE */
        table { border-collapse: separate; border-spacing: 0; font-size: 11px; font-family: Arial, sans-serif; width: max-content; min-width: 100%; }
        
        th, td { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 6px; text-align: center; white-space: nowrap; box-sizing: border-box; }
        th { background-color: #d9d9d9; font-weight: bold; color: #000; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #000; }
        
        /* STICKY FOOTER */
        tfoot td { position: sticky; bottom: 0; background-color: #f2f2f2; font-weight: bold; color: #cc0000; z-index: 10; border-top: 2px solid #000; border-bottom: 2px solid #000; }
        tfoot .sticky-col-3 { text-align: right; padding-right: 10px; color: #000; }

        /* EXACT WIDTHS PARA SA STICKY COLUMNS */
        .sticky-col-1 { position: sticky; left: 0; width: 40px; min-width: 40px; max-width: 40px; background-color: #f3f3f3; z-index: 5; border-right: 1px solid #999; }
        .sticky-col-2 { position: sticky; left: 40px; width: 60px; min-width: 60px; max-width: 60px; background-color: #f3f3f3; z-index: 5; border-right: 1px solid #999; color: #cc0000; }
        .sticky-col-3 { position: sticky; left: 100px; width: 180px; min-width: 180px; max-width: 180px; background-color: #f3f3f3; z-index: 5; border-right: 2px solid #000; text-align: left; padding-left: 8px; overflow: hidden; text-overflow: ellipsis; }
        
        th.sticky-col-1, th.sticky-col-2, th.sticky-col-3 { z-index: 15; background-color: #d9d9d9; }
        tfoot td.sticky-col-1, tfoot td.sticky-col-2, tfoot td.sticky-col-3 { z-index: 12; background-color: #e6e6e6; }

        /* NORMAL SCROLLING COLUMNS */
        .col-duration { background-color: #f9f9f9; text-align: center; font-family: 'Courier New', Courier, monospace; font-weight: bold; min-width: 85px; }
        .col-distance { background-color: #e2efda; text-align: center; min-width: 75px; }
        .col-t { background-color: #fce4d6; font-weight: bold; color: #c00000; text-align: center; min-width: 40px; }
        .col-x { background-color: #f8cbad; font-weight: bold; color: #c00000; border-right: 2px solid #000; text-align: center; min-width: 40px; }

        .cell-scan { color: #0000cc; font-weight: bold; text-align: center; min-width: 35px; }
        .cell-miss { color: #cc0000; text-align: center; min-width: 35px; }
        .no-data { text-align: center; padding: 40px; font-size: 16px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="report-wrapper">
        <!-- 🔍 CONTROL PANEL -->
        <div class="control-panel">
            <label>ROUTE LEVEL:</label>
            <select id="routeSelect">
                <!-- Awtomatikong sudlan sa JS -->
            </select>
            <button onclick="generateDTR()">I-GENERATE DTR</button>
        </div>

        <!-- 📊 REPORT OUTPUT AREA -->
        <div id="dtrContent">
            <div class="no-data">Pili og rota ug i-klik ang button aron kuhaon ang DTR Leaderboard gikan sa Supabase.</div>
        </div>
    </div>

    <!-- Tawgon ang database.js -->
    <script src="database.js"></script>
    
    <script>
        const _supabaseUrl = 'https://iilfklquzyxmdergwawh.supabase.co';
        const _supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpbGZrbHF1enl4bWRlcmd3YXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTkzMDcsImV4cCI6MjEwMzI5NTMwN30.jMctz666CGfTdODLqNr24O3dQ5SDM6K5GkmihCtDdBQ';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(_supabaseUrl, _supabaseAnonKey);
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        // KUMPLETONG FALLBACK GIKAN SA DATABASE.JS
        const fallbackRouteNames = {
            "G1N": "777 (North) MaKahulogan",
            "G1E": "777 (East) LoCoCaMaMa",
            "G1W": "777 (West) DaDiPaPi",
            "G1S": "777 (South) JAS-T'Boli",
            "G3": "3333 Conqueror's Coastal Gaming",
            "G4": "4G IV-Wheelers Riders",
            "G5": "5555 MAN OF STEEL",
            "AS26": "628 ALL STAR EXTREME",
            "G7": "7777 TOUR de FILIPINAS",
            "G81": "888 Route 1",
            "G82": "888 Route 2",
            "G83": "888 Route 3"
        };

        const fallbackCheckpointsAS26 = ["CP 00","CP 01","CP 02","CP 03","CP 04","CP 05","CP 06","CP 07","CP 08","CP 09","CP 10","CP 11","CP 12","CP 13","CP 14","CP 15","CP 16","CP 17","CP 18","CP 19","CP 20","CP 21","CP 22","CP 23","CP 24","CP 25","CP 26","CP 27","CP 28","CP 29","CP 30","CP 31","CP 32","CP 33","CP 34","CP 35","CP 36","CP 37","CP 38","CP FL"];
        
        const fallbackRidersAS26 = [
            { idNum: "0001", fullname: "technicus", nickname: "rayHARGG" },
            { idNum: "0002", fullname: "Long Way Ph", nickname: "Elkapitan Jr" },
            { idNum: "1605", fullname: "Jabla, Joshua", nickname: "JOSHUA" },
            { idNum: "1609", fullname: "PADRONES, ROCKY", nickname: "RaKiE" },
            { idNum: "1617", fullname: "REMOLLENO, ALEXANDER", nickname: "XRM SAKALAM" },
            { idNum: "1634", fullname: "Galvadores, Riche Val", nickname: "Long Way PH" },
            { idNum: "1635", fullname: "German, Henry Gulle", nickname: "technicus" }
        ];

        window.onload = () => {
            let select = document.getElementById('routeSelect');
            
            let activeRoutes = (typeof routeNames !== 'undefined') ? routeNames : fallbackRouteNames;

            for (let key in activeRoutes) {
                let option = document.createElement('option');
                option.value = key;
                option.text = `${key} - ${activeRoutes[key]}`;
                if(key === "AS26") option.selected = true;
                select.add(option);
            }
            
            // 👉 GITANGTANG NA ANG generateDTR() DINHI ARON DILI MO-ABLI DIRITSU
        };

        async function generateDTR() {
            const selectedRoute = document.getElementById('routeSelect').value;
            const container = document.getElementById('dtrContent');

            if (!supabaseClient) {
                container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Error: Wala na-initialize ang Supabase client.</div>`;
                return;
            }

            container.innerHTML = `<div class="no-data">🔄 Gikuha ang data para sa rutang <b>${selectedRoute}</b> gikan sa Supabase...</div>`;

            try {
                // 1. KUHAON ANG SCANS
                let { data: allScans, error } = await supabaseClient
                    .from('rally_scans')
                    .select('*')
                    .order('scanned_at', { ascending: true });

                if (error) throw new Error(error.message);

                // 2. KUHAON ANG CHECKPOINTS
                let expectedCPs = [];
                if (typeof routeCheckpoints !== 'undefined' && routeCheckpoints[selectedRoute]) {
                    expectedCPs = Object.keys(routeCheckpoints[selectedRoute]);
                } else if (selectedRoute === 'AS26') {
                    expectedCPs = fallbackCheckpointsAS26;
                } else if (allScans && allScans.length > 0) {
                    let cpSet = new Set();
                    allScans.forEach(s => { if(s.checkpoint) cpSet.add(String(s.checkpoint).trim()); });
                    expectedCPs = Array.from(cpSet).sort();
                }

                if (expectedCPs.length === 0) {
                    container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Walay checkpoints nga nakita para sa ruta nga ${selectedRoute}.</div>`;
                    return;
                }

                const totalCheckpointsCount = expectedCPs.length;

                // 3. KUHAON ANG RIDERS
                let routeRiders = [];
                if (typeof riderDatabase !== 'undefined') {
                    routeRiders = riderDatabase.filter(r => String(r.level).toUpperCase() === String(selectedRoute).toUpperCase());
                } 
                
                if (routeRiders.length === 0 && selectedRoute === 'AS26') {
                    routeRiders = fallbackRidersAS26;
                }

                if (routeRiders.length === 0) {
                    container.innerHTML = `<div class="no-data" style="color: #cc0000;">❌ Walay rider nga nakarehistro para sa ruta nga ${selectedRoute}.</div>`;
                    return;
                }

                // 4. I-GENERATE ANG HTML TABLE
                let html = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th class="sticky-col-1">#</th>
                                    <th class="sticky-col-2">QR</th>
                                    <th class="sticky-col-3">VEST NAME</th>
                                    <th class="col-duration">DURATION</th>
                                    <th class="col-distance">DISTANCE</th>
                                    <th class="col-t">T</th>
                                    <th class="col-x">X</th>
                `;

                expectedCPs.forEach(cp => {
                    let shortName = cp.replace("CP ", "");
                    html += `<th>${shortName}</th>`;
                });

                html += `
                                </tr>
                            </thead>
                            <tbody>
                `;

                let activeRidersCountT = 0;
                let cpFooterCounts = {};
                expectedCPs.forEach(cp => cpFooterCounts[cp] = 0);

                routeRiders.forEach((rider, index) => {
                    let riderScans = allScans.filter(s => String(s.qr_code) === String(rider.idNum));
                    
                    let durationText = "";
                    let distanceText = "";
                    let totalScannedUnique = 0;
                    let hasStarted = false;
                    
                    let cpCounts = {};
                    expectedCPs.forEach(cp => cpCounts[cp] = 0);

                    if (riderScans.length > 0) {
                        hasStarted = true;
                        let firstScan = new Date(riderScans[0].scanned_at);
                        let lastScan = new Date(riderScans[riderScans.length - 1].scanned_at);
                        let diffMs = lastScan - firstScan;
                        let tH = Math.floor(diffMs / (1000 * 60 * 60));
                        let tM = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                        let tS = Math.floor((diffMs % (1000 * 60)) / 1000);
                        durationText = `${String(tH).padStart(2, '0')}:${String(tM).padStart(2, '0')}:${String(tS).padStart(2, '0')}`;

                        let startOdo = parseFloat(riderScans[0].odometer) || 0;
                        let endOdo = parseFloat(riderScans[riderScans.length - 1].odometer) || startOdo;
                        let dist = endOdo >= startOdo ? (endOdo - startOdo) : endOdo;
                        distanceText = dist > 0 ? dist : "";

                        riderScans.forEach(scan => {
                            let cpCode = String(scan.checkpoint || '').trim();
                            if (cpCounts[cpCode] !== undefined) {
                                cpCounts[cpCode]++;
                            } else if (cpCounts[`CP ${cpCode}`] !== undefined) {
                                cpCounts[`CP ${cpCode}`]++;
                            }
                        });

                        expectedCPs.forEach(cp => {
                            if (cpCounts[cp] > 0) totalScannedUnique++;
                        });
                    }

                    let tDisplay = "";
                    let xDisplay = "";

                    if (hasStarted) {
                        tDisplay = totalScannedUnique;
                        xDisplay = totalCheckpointsCount - totalScannedUnique;
                        activeRidersCountT++;

                        expectedCPs.forEach(cp => {
                            if (cpCounts[cp] > 0) {
                                cpFooterCounts[cp]++;
                            }
                        });
                    } else {
                        xDisplay = totalCheckpointsCount; 
                    }

                    html += `
                        <tr>
                            <td class="sticky-col-1">${index + 1}</td>
                            <td class="sticky-col-2">${rider.idNum}</td>
                            <td class="sticky-col-3">${rider.fullname || rider.nickname}</td>
                            <td class="col-duration">${durationText}</td>
                            <td class="col-distance">${distanceText}</td>
                            <td class="col-t">${tDisplay}</td>
                            <td class="col-x">${xDisplay}</td>
                    `;

                    expectedCPs.forEach(cp => {
                        let count = cpCounts[cp];
                        if (count > 0) {
                            html += `<td class="cell-scan">${count}</td>`;
                        } else {
                            html += `<td class="cell-miss"></td>`;
                        }
                    });

                    html += `</tr>`;
                });

                let grandTotalX = routeRiders.length; 

                html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td class="sticky-col-1" colspan="3">TOTAL</td>
                                    <td class="col-duration"></td>
                                    <td class="col-distance"></td>
                                    <td class="col-t">${activeRidersCountT > 0 ? activeRidersCountT : ''}</td>
                                    <td class="col-x">${grandTotalX}</td>
                `;

                expectedCPs.forEach(cp => {
                    let totalRidersAtCP = cpFooterCounts[cp];
                    html += `<td style="text-align: center;">${totalRidersAtCP > 0 ? totalRidersAtCP : ''}</td>`;
                });

                html += `
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;

                container.innerHTML = html;

            } catch (err) {
                console.error("DTR Generation Error:", err);
                container.innerHTML = `<div class="no-data" style="color: #cc0000; font-size: 16px;">❌ <b>Error:</b> ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
