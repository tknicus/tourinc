            [7.9965505224181, 124.29378197741252], [8.112239996753207, 124.22507941453324], [8.164539613370478, 124.24308801581411], 
            [8.206276757559902, 124.24790150047174], [8.229525385547781, 124.26228130232187], [8.240879051016503, 124.3853598806139], 
            [8.14428828764266, 124.55242153794372], [8.104837695382656, 124.57519474464914], [7.186206, 125.459745], [7.234227, 125.638278]
            ],
            "G82": [],

        };

        // Function sa pag-ilis sa ruta inig pili sa dropdown
        // ==========================================
        // 🗺️ HYBRID ROUTE SWITCHING LOGIC (RED LINE)
        // ==========================================
        async function switchRoute() {
            let rawKey = document.getElementById('routeSelect').value;
            let selectedKey = rawKey ? rawKey.trim().toUpperCase() : "";
            let badge = document.getElementById('distanceBadge');
            
            routePolylineLayer.clearLayers();

            if (!routesData[selectedKey] || routesData[selectedKey].length < 2) {
                badge.style.display = "none";
                loadRidersToMap(selectedKey); 
                return;
            }

            let coords = routesData[selectedKey];
            
            // 🔴 Gihimo natong Pula (#ff0000) ang AS26 para klaro kaayo sa berdeng background sa mapa
            let pinColor = (selectedKey === "AS26") ? "#ff0000" : (routeColors[selectedKey] || '#ff0000');

            // 🛑 HYBRID PARA SA AS26: OSRM sa Highway + Direct Line sa Trail Part 🛑
            if (selectedKey === "AS26") {
                let highwayPart1 = coords.slice(0, 11);
                let trailPart = coords.slice(12, 123);
                let highwayPart2 = coords.slice(122);

                // 1. I-fetch ug i-draw ang Highway Part 1 (Pula)
                await fetchAndDrawOSRM(highwayPart1, pinColor);

                // 2. I-draw direkta ang Trail Part (Pula nga putol-putol / dashed line)
                let directTrail = L.polyline(trailPart, {
                    color: pinColor,
                    weight: 2,
                    opacity: 0.9,
                    dashArray: '6, 6' 
                });
                routePolylineLayer.addLayer(directTrail);

                // 3. I-fetch ug i-draw ang Highway Part 2 (Pula)
                await fetchAndDrawOSRM(highwayPart2, pinColor);

                badge.innerText = `🏁 Route AS26 (Hybrid: Road & Trail)`;
                badge.style.display = "block";
                
                setTimeout(() => {
                    if (routePolylineLayer.getLayers().length > 0) {
                        let group = new L.FeatureGroup(routePolylineLayer.getLayers());
                        map.fitBounds(group.getBounds(), { padding: [50, 50] });
                    }
                }, 500);
            } 
            // 🚙 PARA SA UBANG ROTA 🚙
            else {
                let coordString = coords.map(c => `${c[1]},${c[0]}`).join(';');
                let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

                try {
                    let response = await fetch(osrmUrl);
                    let data = await response.json();

                    if (data.routes && data.routes.length > 0) {
                        let routeData = data.routes[0];
                        let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                        let totalKm = (routeData.distance / 1000).toFixed(1);
                        badge.innerText = `🏁 Total: ${totalKm} KM`;
                        badge.style.display = "block";

                        let roadPolyline = L.polyline(routeCoords, {
                            color: pinColor, 
                            weight: 2,
                            opacity: 0.85
                        });

                        routePolylineLayer.addLayer(roadPolyline);
                        map.fitBounds(roadPolyline.getBounds());
                    }
                } catch (error) {
                    console.error("Napakyas pagkuha sa OSRM route:", error);
                    badge.style.display = "none";
                }
            }

            loadRidersToMap(selectedKey);
        }

        // Helper function para sa OSRM fetch
        async function fetchAndDrawOSRM(coordArray, color) {
            if (coordArray.length < 2) return;
            let coordString = coordArray.map(c => `${c[1]},${c[0]}`).join(';');
            let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

            try {
                let response = await fetch(osrmUrl);
                let data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    let routeData = data.routes[0];
                    let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                    let roadPolyline = L.polyline(routeCoords, {
                        color: color, 
                        weight: 2,
                        opacity: 0.85
                    });
                    
                    routePolylineLayer.addLayer(roadPolyline);
                }
            } catch (error) {
                console.error("Napakyas pagkuha sa OSRM route:", error);
            }
        }




        // 4. KUHAON ANG LIVE RIDERS DIREKTA GIKAN SA SUPABASE TABLE (rally_scans)
        async function loadRidersToMap(selectedRoute = "all") {
            markerLayer.clearLayers();

            if (selectedRoute === "none") return;

            try {
                let { data, error } = await supabaseLiveClient
                    .from('rally_scans')
                    .select('*')
                    .order('scanned_at', { ascending: true }); // 👈 KINI ANG SAKTONG SEKRETO!

                if (error) {
                    console.error("Error sa pagkuha gikan sa Supabase:", error.message);
                    return;
                }

                if (!data || data.length === 0) {
                    console.log("Walay nakit-an nga data sa rally_scans table.");
                    return;
                }

                // Aron makuha ang pinakabag-o nga log sa matag rider
                let latestRidersMap = {};
                data.forEach(rider => {
                    let rId = rider.qr_code || rider.idNum;
                    if (rId) {
                        latestRidersMap[rId] = rider;
                    }
                });

                Object.values(latestRidersMap).forEach(rider => {
                    let lat = parseFloat(rider.latitude);
                    let lon = parseFloat(rider.longitude);
                    let routeKey = rider.rider_level || "G5";
                    
                    // Filter base sa napili sa dropdown kung dili "all"
                    if (selectedRoute !== "all") {
                        if (routeKey.toUpperCase() !== selectedRoute.toUpperCase()) {
                            return; 
                        }
                    }

                    let pinColor = routeColors[routeKey] || "#ff9900"; 

                    if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
                        let formattedTime = "Wala";
                        if (rider.scanned_at || rider.created_at) {
                            let d = new Date(rider.scanned_at || rider.created_at);
                            formattedTime = d.toLocaleString('en-PH', {
                                timeZone: 'Asia/Manila',
                                month: 'short', day: 'numeric',
                                hour: '2-digit', minute: '2-digit', hour12: false
                            });
                        }
                        
                        let marker = L.marker([lat, lon], { icon: createColoredIcon(pinColor) });
                        
                        marker.bindPopup(`
                            <div style="color: black; font-family: Arial; font-size: 13px;">
                                <b>🏍️ ID: ${rider.qr_code || rider.idNum}</b><br>
                                👤 Pangalan: <b>${rider.rider_name || "Rider"}</b><br>
                                📍 Checkpoint: <b>${rider.checkpoint}</b><br>
                                🛣️ Rota: <b style="background: #222; padding: 2px 5px; border-radius: 3px; color:white;">${routeKey}</b><br>
                                ⚙️ Odometer: ${rider.odometer} KM<br>
                                🕒 Oras: ${formattedTime}<br>
                                📝 Notes: <b>${rider.notes || 'Wala'}</b><br>
                                📸 <a href="${rider.photo_url}" target="_blank" style="color:blue; font-weight:bold;">Tan-awa ang Ebidensya</a><br>
                                <a href="${rider.location_address}" target="_blank">🗺️ Google Maps</a>
                            </div>
                        `);
                        markerLayer.addLayer(marker);
                    }
                });

            } catch (err) {
                console.error("Critical error sa pag-load sa map markers:", err);
            }
        }

        // Auto-load tanan riders inig abli sa map
        document.addEventListener("DOMContentLoaded", () => {
            loadRidersToMap("all");
        });
    </script>
