<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP - Live Rider Map (Life360)</title>

    <!-- 🎨 STYLES & LEAFLET MAP CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="scan.png">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #cc0000;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            font-size: 18px;
            font-style: italic;
            text-transform: uppercase;
        }

        .back-btn {
            background-color: #cc0000;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }
        .back-btn:hover { background-color: #990000; }

        #map {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
        }

        .status-bar {
            background: #1e1e1e;
            padding: 10px 20px;
            font-size: 12px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION HEADER -->
    <header>
        <h2>🛰️ MMC Live Rider Map (Life360 Style)</h2>
        <a href="index.html" class="back-btn">Balik sa Home</a>
    </header>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- STATUS FOOTER -->
    <div class="status-bar">
        <span id="connectionStatus">🟢 Nakakonekta sa Supabase Live Feed</span>
        <span>MasterMinds'CUP Endurance Series</span>
    </div>

    <!-- LEAFLET JS & SUPABASE JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ==========================================
        // 🗺️ MAP INITIALIZATION (CENTERED SA MINDANAO / DAVAO REGION)
        // ==========================================
        const map = L.map('map').setView([7.4474, 125.8093], 10); // Default center (Tagum / Davao area)

        // Dark Mode Map Tile (CartoDB Dark Matter)
        // Ilisi kini sa tileLayer nga walay API key requirement
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        // Store active markers para dili mag-doble
        const riderMarkers = {};

        // ==========================================
        // 🔌 SUPABASE CONNECTION CONFIG
        // ==========================================
        const _supabaseUrl = 'https://iilfklquzyxmdergwawh.supabase.co';
        const _supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpbGZrbHF1enl4bWRlcmd3YXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTkzMDcsImV4cCI6MjEwMzI5NTMwN30.jMctz666CGfTdODLqNr24O3dQ5SDM6K5GkmihCtDdBQ';
        
        const supabaseMapClient = window.supabase.createClient(_supabaseUrl, _supabaseAnonKey);

        // ==========================================
        // 📡 FETCH & UPDATE RIDERS LOCATION
        // ==========================================
        async function fetchLiveRiders() {
            const { data, error } = await supabaseMapClient
                .from('rider_locations')
                .select('*');

            if (error) {
                console.error("❌ Error pagkuha sa rider locations:", error.message);
                document.getElementById('connectionStatus').innerHTML = "🔴 Naay problema sa koneksyon";
                return;
            }

            if (data) {
                data.forEach(rider => {
                    const { rider_id, latitude, longitude, battery, updated_at } = rider;
                    
                    let latLng = [latitude, longitude];
                    let batteryIcon = battery <= 15 ? `🪫 ${battery}%` : `🔋 ${battery}%`;
                    let timeAgo = new Date(updated_at).toLocaleTimeString();

                    let popupContent = `
                        <div style="font-family:sans-serif; color:#000; font-size:13px;">
                            <b style="color:#cc0000; font-size:14px;">Rider ID: #${rider_id}</b><br>
                            📍 Lat: ${latitude.toFixed(5)}<br>
                            Lon: ${longitude.toFixed(5)}<br>
                            ${batteryIcon}<br>
                            <span style="font-size:11px; color:#666;">Na-update: ${timeAgo}</span>
                        </div>
                    `;

                    if (riderMarkers[rider_id]) {
                        // Kung naa na ang marker, i-update lang ang posisyon (Life360 style smooth move)
                        riderMarkers[rider_id].setLatLng(latLng);
                        riderMarkers[rider_id].getPopup().setContent(popupContent);
                    } else {
                        // Kung wala pa, himo og bag-ong marker sa mapa
                        let customIcon = L.divIcon({
                            className: 'custom-rider-marker',
                            html: `<div style="background-color: #cc0000; color: white; border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; box-shadow: 0 0 8px rgba(0,0,0,0.8);">${rider_id}</div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        let marker = L.marker(latLng, { icon: customIcon }).addTo(map)
                            .bindPopup(popupContent);
                        
                        riderMarkers[rider_id] = marker;
                    }
                });
            }
        }

        // 🔄 Automatic Refresh matag 10 segundos
        fetchLiveRiders();
        setInterval(fetchLiveRiders, 10000);

        // ⚡ REAL-TIME SUBSCRIPTION (MOKalit og update kung naay bag-ong ping)
        supabaseMapClient
            .channel('public:rider_locations')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rider_locations' }, payload => {
                console.log('⚡ Real-time update nadawat:', payload);
                fetchLiveRiders(); // Refresh dayon ang mapa
            })
            .subscribe();
    </script>
</body>
</html>
