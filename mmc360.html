<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP - Live Rider Map (Life360)</title>

    <!-- 🎨 STYLES & LEAFLET MAP CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="scan.png">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #cc0000;
            height: 50px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            font-size: 18px;
            font-style: italic;
            text-transform: uppercase;
        }

        .back-btn {
            background-color: #cc0000;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }
        .back-btn:hover { background-color: #990000; }

        /* Map Container Height Fix */
        #map {
            width: 100%;
            height: calc(100vh - 90px);
            background-color: #2b2b2b;
        }

        .status-bar {
            background: #1e1e1e;
            padding: 10px 20px;
            font-size: 12px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
            height: 40px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION HEADER -->
    <header>
        <h2>🛰️ MMC Live Rider Map (Life360 Style)</h2>
        <a href="index.html" class="back-btn">Balik sa Home</a>
    </header>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- STATUS FOOTER -->
    <div class="status-bar">
        <span id="connectionStatus">🟢 Nakakonekta sa Supabase Live Feed</span>
        <span>MasterMinds'CUP Endurance Series</span>
    </div>

    <!-- LEAFLET JS & SUPABASE JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ==========================================
        // 🗺️ MAP INITIALIZATION (CENTERED SA MINDANAO / DAVAO REGION)
        // ==========================================
        const map = L.map('map').setView([7.4474, 125.8093], 10);

        // OpenStreetMap Standard Tiles (Hayag, limpyo, ug walay watermark)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // ==========================================
        // 🔌 SUPABASE CONNECTION CONFIG
        // ==========================================
        const _supabaseUrl = 'https://iilfklquzyxmdergwawh.supabase.co';
        const _supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpbGZrbHF1enl4bWRlcmd3YXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTkzMDcsImV4cCI6MjEwMzI5NTMwN30.jMctz666CGfTdODLqNr24O3dQ5SDM6K5GkmihCtDdBQ';
        
        const supabaseMapClient = window.supabase.createClient(_supabaseUrl, _supabaseAnonKey);

        // ==========================================
        // 📡 FETCH & UPDATE RIDERS LOCATION
        // ==========================================
        const riderMarkers = {};
        const lastRiderPositions = {}; // Katabang aron mahibaw-an kon naglihok ba

        async function fetchLiveRiders() {
            const { data, error } = await supabaseMapClient
                .from('rider_locations')
                .select('*');

            if (error) {
                console.error("❌ Error pagkuha sa rider locations:", error.message);
                document.getElementById('connectionStatus').innerHTML = "🔴 Naay problema sa koneksyon";
                return;
            }

            if (data) {
                data.forEach(rider => {
                    const { rider_id, latitude, longitude, battery, updated_at } = rider;
                    
                    let latLng = [latitude, longitude];
                    let batteryIcon = battery <= 15 ? `🪫 ${battery}%` : `🔋 ${battery}%`;
                    let timeAgo = new Date(updated_at).toLocaleTimeString();

                    // --- 🏍️ MOVEMENT CHECKER LOGIC ---
                    let isMoving = false;
                    if (lastRiderPositions[rider_id]) {
                        let oldLat = lastRiderPositions[rider_id].lat;
                        let oldLon = lastRiderPositions[rider_id].lon;
                        
                        if (oldLat !== latitude || oldLon !== longitude) {
                            isMoving = true;
                        }
                    }
                    
                    lastRiderPositions[rider_id] = { lat: latitude, lon: longitude };

                    let popupContent = `
                        <div style="font-family:sans-serif; color:#000; font-size:13px;">
                            <b style="color:#cc0000; font-size:14px;">Rider ID: #${rider_id}</b><br>
                            Status: <b style="color:${isMoving ? 'green' : 'orange'}">${isMoving ? '🏍️ Nagdagan' : '🛑 Naghunong'}</b><br>
                            📍 Lat: ${latitude.toFixed(5)}<br>
                            Lon: ${longitude.toFixed(5)}<br>
                            ${batteryIcon}<br>
                            <span style="font-size:11px; color:#666;">Na-update: ${timeAgo}</span>
                        </div>
                    `;

                    let customIcon;
                    if (isMoving) {
                        customIcon = L.divIcon({
                            className: 'moving-rider-marker',
                            html: `<div style="background-color: #ff9900; color: black; border: 2px solid #fff; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 0 10px rgba(0,0,0,0.8);" title="Naglihok si #${rider_id}">🏍️</div>`,
                            iconSize: [35, 35],
                            iconAnchor: [17, 17]
                        });
                    } else {
                        customIcon = L.divIcon({
                            className: 'static-rider-marker',
                            html: `<div style="background-color: #cc0000; color: white; border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; box-shadow: 0 0 8px rgba(0,0,0,0.8);">${rider_id}</div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });
                    }

                    if (riderMarkers[rider_id]) {
                        riderMarkers[rider_id].setLatLng(latLng);
                        riderMarkers[rider_id].setIcon(customIcon);
                        riderMarkers[rider_id].getPopup().setContent(popupContent);
                    } else {
                        let marker = L.marker(latLng, { icon: customIcon }).addTo(map)
                            .bindPopup(popupContent);
                        
                        riderMarkers[rider_id] = marker;
                    }
                });
            }
        }

        // 🔄 Automatic Refresh matag 10 segundos
        fetchLiveRiders();
        setInterval(fetchLiveRiders, 10000);

        // ⚡ REAL-TIME SUBSCRIPTION
        supabaseMapClient
            .channel('public:rider_locations')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rider_locations' }, payload => {
                console.log('⚡ Real-time update nadawat:', payload);
                fetchLiveRiders();
            })
            .subscribe();
    </script>
</body>
</html>
